pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'projectbench'

// JDLib (own UI/HUD/FX bridge over LDLib2), built from the sibling checkout while it is being developed
includeBuild('../JDLib')
