modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

# The furnaces' and the brewing stand's progress (their dataAccess), read by the bench's window.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "logo.png"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional: the bench's recipe transfer, its catalyst and the hidden switches in JEI (compat/jei)
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19.0,)"
ordering = "NONE"
side = "CLIENT"

# Optional: Polymorph's recipe selector on the bench's window (compat/polymorph)
[[dependencies.${mod_id}]]
modId = "polymorph"
type = "optional"
versionRange = "[1.2.0+1.21.1,)"
ordering = "NONE"
side = "CLIENT"
